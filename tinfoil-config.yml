# TCP egress probe (probe-v0.0.2): does an enclave reach Render's Postgres on 5432?
# Same image as probe-v0.0.1; the HEALTH CHECK is the experiment. If this deployment
# reaches `ready`, a bare TCP connect to the Postgres host succeeded through the
# egress allowlist; if it fails "unhealthy", the allowlist (or the host) blocks 5432.
cvm-version: 0.14.7
cpus: 2
memory: 8192
networks:
  egress:
    egress: allowlist
    allow:
      - dpg-d9jrmi67r5hc73ddemi0-a.oregon-postgres.render.com
      - api.ipify.org
containers:
  - name: "egress-probe"
    image: "ghcr.io/kaifaust/peachy-enclave/egress-probe@sha256:dcb70c2449111e03ab07b90b736a6fefc6419ca148aec2f7d209f248699353a1"
    networks: [egress]
    read_only: true
    tmpfs:
      /tmp: "size=16m,mode=1777"
    healthcheck:
      test: ["CMD", "nc", "-z", "-w", "5", "dpg-d9jrmi67r5hc73ddemi0-a.oregon-postgres.render.com", "5432"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 20s
    restart: always
    stop_signal: SIGTERM
    stop_timeout: 5
shim:
  upstream-port: 8080
  paths:
    - /healthz
    - /ip
