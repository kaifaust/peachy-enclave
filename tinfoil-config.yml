# Tinfoil Container definition for peachy-assistant — the PRODUCTION shape.
#
# The name is historical: the assistant is gone (docs/private-ai-spec.md), and
# what runs in here is the WORKER (server/worker-main.ts) — device triage,
# contact discovery and the tagger, each behind its own flag in the measured
# `env:` block below. The container, image and hostname keep the old name
# because renaming a live service is a human's call.
#
# The container was created on 2026-09-17. This file is no longer a proposal:
# it is what the deployed enclave is measured against.
#
# Source of truth lives here, in the private repo, beside the Dockerfile it
# pins. Tinfoil reads it from the root of a PUBLIC GitHub repo (the measurement
# is published to Sigstore against that repo's tagged releases), so the release
# workflow copies this file verbatim into that repo's tag; see
# docs/tinfoil-container.md §The public config repo. Nothing here is secret BY
# CONSTRUCTION — the whole file is published, base64'd, inside the measured
# release artifact — which is why the values below are names, digests and
# hostnames only.
#
# Schema: github.com/tinfoilsh/tinfoil-config. Resources are measured and
# immutable — changing them is a new release, not a dashboard edit.

# Private secrets (keyserver-released, sealed to the attestation) need ≥ 0.13.0
# and egress allowlists ≥ 0.10.0, so either would do. 0.14.7 because that is
# what the egress probe actually ran on 2026-09-16 and what the template ships
# today — an untested older CVM image buys nothing.
cvm-version: 0.14.7

# The smallest shape on offer (2 cores / 8 GB). 8 GB is 4× the Render plan the
# worker ran on, and far more than a worker that claims one short job at a time
# needs now that no assistant run spawns a subprocess in here — but there is no
# smaller shape to choose. ~$166/month at list price, running 24/7.
cpus: 2
memory: 8192

networks:
  egress:
    # Hostnames only, IPv4 only, re-resolved about every 60s, no wildcards.
    # RFC1918 is blocked regardless — Render's internal `dpg-…-a` hostname is
    # unreachable from here, hence the EXTERNAL Postgres host below and the
    # inbound-allowlist question in docs/tinfoil-container.md §Postgres egress.
    egress: allowlist
    allow:
      # Postgres — peachy-db's EXTERNAL hostname (from Render's
      # `/v1/postgres/<id>/connection-info`; the internal `dpg-…-a` form is
      # RFC1918 and unreachable from an enclave).
      - dpg-d9jrmi67r5hc73ddemi0-a.oregon-postgres.render.com
      # The model provider. ONE, since 2026-09-17: every call goes to the
      # attested enclave (server/inference.ts). api.anthropic.com came OUT of
      # this list that day, which makes the allowlist itself part of the
      # claim — a build of this image physically cannot reach Anthropic, and
      # the allowlist is inside what the attestation measures. Device triage
      # and the tagger are the calls that go here.
      - inference.tinfoil.sh
      # Attestation of inference.tinfoil.sh at boot (server/tinfoil-attest.ts
      # via @tinfoilsh/verifier). MEASURED on 2026-09-17 by running a full
      # verify with dns.lookup and fetch instrumented: the verifier fetches the
      # GitHub release metadata and AMD's VCEK chain through Tinfoil's own
      # proxies, and the Sigstore trust root ships inside the package, so
      # these three hosts are the whole set. (The earlier guess listed
      # api.github.com, github.com, two sigstore hosts and kdsintf.amd.com —
      # none were contacted.) A missing host here fails closed as a 503 on
      # every model call, for everyone — there are no cohorts — so re-measure
      # after bumping @tinfoilsh/verifier.
      - github-proxy.tinfoil.sh
      - kds-proxy.tinfoil.sh
      # R2 — the account's S3 endpoint and the public media host, derived from
      # prd's R2_ACCOUNT_ID and R2_PUBLIC_BASE_URL on 2026-09-17. Both are
      # already public: the media host is in every image URL the app serves.
      # server/r2.ts is in the worker's import graph (through server/rows.ts),
      # which is why R2's secrets are mounted below.
      - c6b00e1a7686e9f69631784067aef768.r2.cloudflarestorage.com
      - pub-8dfa5e1a5ad9455b8806d7af46594254.r2.dev

# A LIST of containers, each with a `name` — not a map keyed by name. The
# decoder in tinfoilsh/tinfoil-config declares `Containers []Container`, so the
# map form this file used until 2026-09-16 would have been rejected at the
# first release. The list form is the one the probe release actually validated
# (docs/tinfoil-container.md §Measured egress). `env` is a list of single-key
# mappings for the same reason.
containers:
  - name: worker
    # Digest-pinned, never a bare tag: the digest is what the attestation
    # commits to. The release workflow substitutes the real digest into the
    # tagged copy; main keeps the zero placeholder on purpose so a copy-paste
    # cannot float.
    #
    # The image may STAY PRIVATE — the docs are explicit that pinning by digest
    # is what makes a deployment verifiable, and "whether the image bytes are
    # publicly pullable doesn't affect verifiability" — but pulling a private
    # one needs registry credentials, and this org does not have that
    # entitlement yet (§Decisions that are not mine to make).
    image: ghcr.io/kaifaust/peachy-assistant:v0.1.12@sha256:26dd1384b5aaab451260ba0b12dc2f2983ee915a8ea27cf87d06327f18f7f0ff
    networks: [egress]
    env:
      # server/db.ts productionSignal() keys off RENDER; outside Render it is
      # unset, and this process must count as production in here (it refuses
      # the e2e forced-attestation-failure knob on that signal, among others).
      - RENDER: "1"
      - RENDER_SERVICE_NAME: peachy-assistant-tinfoil
      - PEACHY_HEALTH_PORT: "8080"
      # Node's module compile cache. The root filesystem is read-only, so it
      # lives on the /tmp tmpfs below.
      - NODE_COMPILE_CACHE: /tmp/peachy-agent-cc
      # WHICH MODEL, IN PUBLIC. These three moved out of `secrets:` on
      # 2026-09-17, and the move is the point: everything in this file is
      # published, base64'd, inside the measured release artifact, so declaring
      # them here makes the provider and the model part of what the attestation
      # commits to. Anyone verifying the enclave can read which model answered
      # them, rather than taking our word for it. `tinfoil` is also the only
      # value the worker will boot on (server/inference.ts).
      - PEACHY_INFERENCE_PROVIDER: tinfoil
      - PEACHY_TINFOIL_MODEL: glm-5-3-flash
      # deepseek and not glm on the fast tier: glm-5-3-flash answered 0/23 of
      # the triage eval inside the then server-side triage's 8 s budget on
      # 2026-09-17 while deepseek-v4-1-flash answered 22/23 at half the latency
      # (docs/inference-provider.md §Re-measured on 2026-09-17, and it is a RED).
      # The fast tier stays on the model that answers in time until a
      # re-measurement says otherwise.
      - PEACHY_TINFOIL_FAST_MODEL: deepseek-v4-1-flash
      # Rung-2 step 3 (docs/rung2-worker-migration.md): the same move for the
      # TAGGER, which is the highest-volume body→prompt path in the product —
      # one classification per message sent, plus the ten-minute backfill sweep
      # that the API stops running under this flag and this process takes over.
      # peachy-api hands over a kind and an id; the words are read in here.
      - PEACHY_TAGGER_IN_WORKER: "1"
      # CONTACT DISCOVERY (docs/contact-discovery.md). The one path in here
      # that handles PHONE NUMBERS rather than message text: peachy-api relays
      # a sealed address book it cannot open, this process opens it, matches it
      # and seals the answer back. Declared in the public, measured block for
      # the same reason the model ids are — a verifier can read off the release
      # artifact that contact matching happens inside the measurement, rather
      # than taking our word for it.
      #
      # The key pair it seals against is generated at boot IN HERE and mounted
      # from nowhere, so there is no secret to add below; only the public half
      # leaves, on /healthz/config, which the shim already exposes. A relaunch
      # invalidates it, which is the point.
      #
      # The API side reads the same flag the other way round: it relays unless
      # explicitly off, and this side claims only when explicitly on
      # (server/contact-jobs.ts). Neither side alone is unsafe: with the API's
      # off nothing is ever enqueued, and with this one off every discovery
      # call answers `unavailable`. That is fail CLOSED and the end of it —
      # the plaintext SyncContacts is DELETED, so there is nothing to fall
      # back to (docs/contact-discovery.md §The two rpcs). Every client shows
      # "contact matching is unavailable" and sends nothing until a claimer
      # is here.
      - PEACHY_CONTACTS_IN_ENCLAVE: "1"
      # DEVICE TRIAGE — the AI notification options (server/device-triage-jobs.ts,
      # docs/private-ai-spec.md §Device-side triage). A person's device seals a
      # notification to this enclave's per-boot key; peachy-api relays the
      # sealed blob it cannot open, this process opens it, asks the model
      # whether to notify or hold, and seals the verdict back. Declared in the
      # public, measured block for the same reason as the two flags above: a
      # verifier can read off the release artifact that this is where those
      # words are read.
      #
      # Like contact discovery, the key pair is generated at boot in here and
      # mounted from nowhere; only its public half leaves, on /healthz/config.
      # And like contact discovery the two sides read the flag in opposite
      # directions: this claimer runs only when explicitly on, and the API
      # relays unless explicitly off (a rollback, not a switch).
      - PEACHY_DEVICE_TRIAGE_IN_ENCLAVE: "1"
      # THE PIN VAULT (server/pin-vault.ts, docs/device-identity.md §The PIN
      # vault). A device seals a backup of the account key, locked under an
      # Argon2id stretch of the person's PIN, to this enclave's per-boot key;
      # the entry lives in this process's memory with a ten-guess limit and is
      # never written anywhere, so no operator can roll a guess counter back.
      # Added 2026-09-24, first released in v0.1.12 on 2026-09-25. Without
      # it the enclave publishes no `pinVaultPublicKey` and every client reads
      # the PIN as unavailable. Same opposite-direction reading as the two
      # flags above: this side holds the vault only when explicitly on.
      - PEACHY_PIN_VAULT_IN_ENCLAVE: "1"
    # Names only; values live in Tinfoil's secret store (or, for private
    # secrets, in a keyserver Peachy runs). The list matches render.yaml's
    # peachy-assistant `sync: false` block. Shorter since 2026-09-17:
    # ANTHROPIC_API_KEY is gone because nothing reads it, and
    # PEACHY_INFERENCE_PROVIDER moved to the public `env:` block above, where
    # it says something a verifier can check. Shorter again with the assistant
    # gone: GOOGLE_MAPS_API_KEY was its search_places tool and the agent
    # leaves' sealing root went with the leaves, and nothing in the worker
    # reads either. The device root (PEACHY_DEVICE_CREDENTIAL_KEY) is not in this
    # list and never will be.
    secrets:
      - DATABASE_URL
      - TINFOIL_API_KEY
      - R2_ACCOUNT_ID
      - R2_ACCESS_KEY_ID
      - R2_SECRET_ACCESS_KEY
      - R2_BUCKET
      - R2_PUBLIC_BASE_URL
      - R2_PRIVATE_BUCKET
    # The root filesystem is read-only by default (keep it). Anything the
    # process writes, the compile cache included, goes under /tmp, so that gets
    # a tmpfs — RAM, counted against the 8 GB, wiped on every relaunch.
    read_only: true
    tmpfs:
      /tmp: "size=1g,mode=1777"
    # Docker-Compose-shaped. An `Unhealthy` during boot fails the deployment,
    # which is what we want: a worker that cannot reach Postgres should not
    # become the live one. start_period covers applySchema + the enclave
    # attestation warm-up.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: always
    stop_signal: SIGTERM
    # server/worker-main.ts stops claiming on SIGTERM and drains in-flight jobs
    # for up to 10s.
    stop_timeout: 30

# Mandatory, and the reason the worker grew a health listener: a deployment
# must forward SOMETHING. Only the two health paths are exposed; everything
# else 404s at the shim. There is no inbound rpc surface here by design —
# the worker's inputs and outputs cross Postgres (server/worker-main.ts).
#
# The explicit-path form (rather than the template's `/*`) was verified on the
# probe deployment: both listed paths answered through the shim.
shim:
  upstream-port: 8080
  paths:
    - /healthz
    - /healthz/config
